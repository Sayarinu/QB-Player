[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "queens_blood_ai"
version = "0.1.0"
description = "Queen's Blood AI Simulator and Bot System"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "gymnasium>=0.28.0",
    "stable-baselines3>=2.0.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "pytest>=7.3.0",
    "tqdm>=4.65.0",
    "tensorboard>=2.13.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["queens_blood_ai*"]
