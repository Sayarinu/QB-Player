training:
  num_iterations: 1000
  games_per_iteration: 100
  update_frequency: 10
  evaluation_frequency: 50
  save_path: "queens_blood_model.pth"
  league_path: "league_checkpoints/"
  num_envs: 12
  num_steps: 128  # Steps per env per update
  
ppo:
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_loss_coef: 0.5
  epochs: 10
  
network:
  hidden_dims: [256, 256]
  activation: relu
  
environment:
  reward_type: dense  # sparse or dense
  max_turns: 100
